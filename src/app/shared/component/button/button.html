@if (appearance() === 'outlined') {
  <button mat-stroked-button type="button" [disabled]="disabled()" (click)="clicked.emit()">
    @if (icon(); as name) {
      <bhw-icon [name]="name" />
    }
    {{ label() }}
  </button>
} @else {
  <button mat-flat-button type="button" [disabled]="disabled()" (click)="clicked.emit()">
    @if (icon(); as name) {
      <bhw-icon [name]="name" />
    }
    {{ label() }}
  </button>
}
